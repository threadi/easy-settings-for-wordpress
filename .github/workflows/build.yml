name: Release

on:
  push:
    tags:
      - 'build-[0-9]+.[0-9]+.[0-9]+'
      - 'build-[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g., 1.1.0 or 1.1.0-beta1'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate example JSON against schema
        run: composer validate-schema

      - name: Extract release notes from changelog
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#build-}"
          fi
          # Prints the body of the section "## [<version>] ..." up to the next "## " heading.
          extract() {
            awk -v head="## [$1]" '
              { sub(/\r$/, "") }
              index($0, head) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' changelog.md | sed -e '/./,$!d' | sed -e ':a' -e '/^\n*$/{$d;N;ba' -e '}'
          }
          NOTES="$(extract "${VERSION}")"
          # Pre-releases like 1.1.0-beta1 fall back to the entry for 1.1.0.
          if [ -z "${NOTES}" ] && [ "${VERSION}" != "${VERSION%%-*}" ]; then
            NOTES="$(extract "${VERSION%%-*}")"
          fi
          if [ -z "${NOTES}" ]; then
            echo "::error::No entry for version ${VERSION} found in changelog.md"
            exit 1
          fi
          printf '%s\n' "${NOTES}" > "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md"

      - name: Tag release
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            TAG="${INPUT_VERSION}"
          else
            TAG="${GITHUB_REF_NAME#build-}"
          fi
          test -d build || { echo "build/ missing – compiling failed?"; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build
          git commit -m "Build assets for ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease";; esac
          gh release create "$TAG" --title "$TAG" --notes-file "${RUNNER_TEMP}/release-notes.md" $PRE
